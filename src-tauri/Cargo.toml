[package]
name = "dynamic-island"
version = "0.1.0"
description = "A Dynamic Island for Windows"
authors = ["d4kw1n"]
edition = "2021"
rust-version = "1.82"

[features]
# Embedded production assets. `tauri build` enables this automatically; without
# it the binary stays in dev mode and tries to reach the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures = "0.3"
toml_edit = "0.22"
url = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinHttp",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
